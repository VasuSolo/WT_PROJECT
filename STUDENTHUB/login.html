<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="style.css">

    <script>
    function validateLogin() {

        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;

        if (email === "") {
            alert("Please enter your Email!");
            document.getElementById("email").focus();
            return false;
        }

        if (password === "") {
            alert("Please enter your Password!");
            document.getElementById("password").focus();
            return false;
        }

        if (password.length < 8) {
            alert("Password must be at least 8 characters!");
            document.getElementById("password").focus();
            return false;
        }

        if (!/[A-Z]/.test(password)) {
            alert("Password must contain one uppercase letter!");
            document.getElementById("password").focus();
            return false;
        }

        if (!/[a-z]/.test(password)) {
            alert("Password must contain one lowercase letter!");
            document.getElementById("password").focus();
            return false;
        }

        if (!/[0-9]/.test(password)) {
            alert("Password must contain one number!");
            document.getElementById("password").focus();
            return false;
        }

        if (!/[!@#$%^&*]/.test(password)) {
            alert("Password must contain one special character!");
            document.getElementById("password").focus();
            return false;
        }

        alert("Login Successful!");
        return true;
    }
    </script>
</head>

<body>

    <header>
        <div class="logo">
            <h1>StudentHub</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="form-section">

            <h2>Student Login</h2>

            <p>Login to access your StudentHub dashboard.</p>

            <form action="index.html" method="get" onsubmit="return validateLogin()">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="btn">
                    Login
                </button>

                <button type="reset" class="btn">
                    Clear
                </button>

                <p class="form-link">
                    Don't have an account?
                    <a href="register.html">Register Here</a>
                </p>

            </form>

        </section>

    </main>

</body>
</html>
